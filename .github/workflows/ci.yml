name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  wallet-windows-build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.102
      - name: Publish self-contained wallet
        run: dotnet publish wallet-app/DeroMWallet.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:ContinuousIntegrationBuild=true -p:Deterministic=true --output artifacts/wallet
      - name: Generate wallet checksum
        shell: pwsh
        run: Get-FileHash artifacts/wallet/DeroMWallet.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  DeroMWallet.exe" } | Set-Content artifacts/wallet/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: derom-wallet-win-x64
          path: artifacts/wallet/*
          if-no-files-found: error
